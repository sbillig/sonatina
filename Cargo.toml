[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/ir",
    "crates/codegen",
    "crates/parser",
    "crates/filecheck",
    "crates/triple",
    "crates/macros",
    "crates/interpreter",
    "crates/verifier",
]

[workspace.package]
edition = "2024"

[patch.crates-io]
target-lexicon = { git = "https://github.com/fe-lang/wasmtime", rev = "5bbb125" }
